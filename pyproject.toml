[project]
name = "bank-equity-researcher"
version = "0.1.0"
description = "First-pass banking-sector equity research agent: explains and attributes movements in Australian bank headline metrics with confidence-rated, cited evidence"
readme = "README.md"
authors = [
    { name = "Michael Zhao", email = "michael.yj.zhao@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
